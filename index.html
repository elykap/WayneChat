<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c5449" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>WayneChat</title>
    <script>
      (function() {
        var t = localStorage.getItem('waynechat-theme');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          if (meta) meta.content = t === 'dark' ? '#18181b' : '#0c5449';
        } else if (meta) {
          meta.content = window.matchMedia('(prefers-color-scheme: dark)').matches ? '#18181b' : '#0c5449';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
